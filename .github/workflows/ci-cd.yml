name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.12.20
      - name: Install locked dependencies
        run: uv sync --locked --no-dev --no-install-project
      - name: Run unit and Streamlit app tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Validate Compose configuration
        env:
          GROQ_API_KEY: ci-placeholder
        run: docker compose config --quiet

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime image
        run: docker build --tag ats-checker:ci .
      - name: Test application inside runtime image
        run: >-
          docker run --rm
          --mount type=bind,source="$GITHUB_WORKSPACE/tests",target=/app/tests,readonly
          ats-checker:ci python -m unittest discover -s tests -v
      - name: Verify container startup and health
        shell: bash
        run: |
          docker run --detach --name ats-checker-ci ats-checker:ci
          trap 'docker logs ats-checker-ci; docker rm --force ats-checker-ci' EXIT
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' ats-checker-ci)
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              exit 1
            fi
            sleep 2
          done
          echo "Container did not become healthy in time"
          exit 1
      - name: Save tested image
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: docker save ats-checker:ci | gzip > /tmp/ats-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: tested-image
          path: /tmp/ats-image.tar.gz
          retention-days: 1

  publish:
    needs: container
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: /tmp
      - name: Load tested image
        run: gunzip -c /tmp/ats-image.tar.gz | docker load
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag ats-checker:ci "$image:sha-$COMMIT_SHA"
          docker tag ats-checker:ci "$image:latest"
          docker push "$image:sha-$COMMIT_SHA"
          docker push "$image:latest"
