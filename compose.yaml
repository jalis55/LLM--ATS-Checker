services:
  app:
    image: ${ATS_IMAGE:-llm-ats-checker:local}
    build: .
    ports:
      - "127.0.0.1:${PORT:-8501}:8501"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env or your shell}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
    restart: unless-stopped
    init: true
